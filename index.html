<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Numerik Quest</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #f3efff;
            --bg2: #e2f6ff;
            --card: #fff;
            --ink: #1d1740;
            --mut: #6a6490;
            --line: #d9d2f5;
            --p: #6c4cff;
            --ok: #12b886;
            --bad: #ff5470;
            --gold: #ffb703;
            --code: #f0ebff;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #150f2e;
                --bg2: #0b2a3c;
                --card: #241a4d;
                --ink: #f1edff;
                --mut: #a79fd6;
                --line: #3b2f75;
                --code: #32266b
            }
        }

        :root[data-theme="dark"] {
            --bg: #150f2e;
            --bg2: #0b2a3c;
            --card: #241a4d;
            --ink: #f1edff;
            --mut: #a79fd6;
            --line: #3b2f75;
            --code: #32266b
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(160deg, var(--bg), var(--bg2)) fixed;
            color: var(--ink);
            font-family: Nunito, system-ui, sans-serif;
            font-size: 16px;
            line-height: 1.55
        }

        h1,
        h2,
        h3,
        .dsp {
            font-family: 'Baloo 2', system-ui, sans-serif;
            margin: 0;
            line-height: 1.15
        }

        .wrap {
            max-width: 720px;
            margin: 0 auto;
            padding: 12px 16px 60px
        }

        .top {
            position: sticky;
            top: env(safe-area-inset-top, 0px);
            z-index: 5;
            background: var(--card);
            border: 2px solid var(--line);
            border-radius: 20px;
            padding: 10px 14px;
            margin: 8px 0 18px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            box-shadow: 0 4px 0 var(--line)
        }

        .rank {
            font-weight: 800;
            font-family: 'Baloo 2';
            font-size: 18px
        }

        .bar {
            flex: 1;
            min-width: 120px;
            height: 14px;
            background: var(--code);
            border-radius: 99px;
            overflow: hidden
        }

        .bar i {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, var(--p), #00c2ff);
            border-radius: 99px;
            transition: width .6s
        }

        .xp {
            font-weight: 700;
            color: var(--mut);
            font-size: 14px
        }

        .hero {
            text-align: center;
            padding: 10px 0 6px
        }

        .hero h1 {
            font-size: clamp(34px, 8vw, 54px);
            font-weight: 800;
            background: linear-gradient(90deg, #6c4cff, #00b4ff, #ff5fa2);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent
        }

        .hero p {
            color: var(--mut);
            margin: 6px auto 0;
            max-width: 460px
        }

        .path {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-top: 22px
        }

        .path:before {
            content: "";
            position: absolute;
            left: 50%;
            top: 20px;
            bottom: 20px;
            border-left: 4px dashed var(--line);
            transform: translateX(-2px)
        }

        .node {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            width: min(78%, 360px);
            padding: 12px 14px;
            border-radius: 22px;
            background: var(--card);
            border: 3px solid var(--c);
            box-shadow: 0 5px 0 var(--c);
            cursor: pointer;
            text-align: left;
            font: inherit;
            color: inherit;
            transition: transform .15s
        }

        .node:nth-child(odd) {
            align-self: flex-start
        }

        .node:nth-child(even) {
            align-self: flex-end
        }

        .node:hover:not(:disabled) {
            transform: translateY(-3px)
        }

        .node:disabled {
            opacity: .45;
            cursor: not-allowed;
            filter: grayscale(.7)
        }

        .node .em {
            font-size: 34px;
            width: 56px;
            height: 56px;
            display: grid;
            place-items: center;
            background: var(--c);
            border-radius: 18px;
            flex: none
        }

        .node b {
            display: block;
            font-family: 'Baloo 2';
            font-size: 18px
        }

        .node small {
            color: var(--mut)
        }

        .stars {
            letter-spacing: 2px;
            color: var(--gold)
        }

        .boss {
            --c: #ff5470
        }

        .card {
            background: var(--card);
            border: 2px solid var(--line);
            border-radius: 22px;
            padding: 18px;
            margin: 14px 0;
            box-shadow: 0 4px 0 var(--line)
        }

        .back {
            background: none;
            border: 0;
            color: var(--p);
            font: 700 15px Nunito;
            cursor: pointer;
            padding: 6px 0
        }

        .pt {
            display: flex;
            gap: 10px;
            margin: 10px 0
        }

        .pt .ic {
            font-size: 22px;
            flex: none
        }

        code,
        pre {
            background: var(--code);
            border-radius: 8px;
            font-family: ui-monospace, Menlo, monospace;
            font-size: 14px
        }

        code {
            padding: 1px 6px
        }

        pre {
            padding: 10px 12px;
            overflow-x: auto;
            margin: 6px 0
        }

        .btn {
            background: var(--p);
            color: #fff;
            border: 0;
            border-radius: 16px;
            padding: 12px 22px;
            font: 800 17px 'Baloo 2';
            cursor: pointer;
            box-shadow: 0 5px 0 #4a30c4;
            margin-top: 8px
        }

        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #4a30c4
        }

        .btn.alt {
            background: var(--card);
            color: var(--p);
            border: 2px solid var(--p);
            box-shadow: 0 4px 0 var(--line)
        }

        .opt {
            display: block;
            width: 100%;
            text-align: left;
            margin: 10px 0;
            padding: 13px 16px;
            border-radius: 16px;
            border: 2px solid var(--line);
            background: var(--card);
            color: var(--ink);
            font: 700 16px Nunito;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--line)
        }

        .opt:hover:not(:disabled) {
            border-color: var(--p)
        }

        .opt.good {
            border-color: var(--ok);
            background: color-mix(in srgb, var(--ok) 20%, var(--card))
        }

        .opt.bad {
            border-color: var(--bad);
            background: color-mix(in srgb, var(--bad) 20%, var(--card))
        }

        .fb {
            padding: 12px 14px;
            border-radius: 14px;
            margin-top: 10px;
            font-weight: 700
        }

        .fb.good {
            background: color-mix(in srgb, var(--ok) 18%, var(--card))
        }

        .fb.bad {
            background: color-mix(in srgb, var(--bad) 18%, var(--card))
        }

        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 800
        }

        .big {
            font-size: 64px;
            text-align: center
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            margin: 8px 0
        }

        th,
        td {
            padding: 5px 6px;
            border-bottom: 1px solid var(--line);
            text-align: right
        }

        th {
            color: var(--mut)
        }

        .conf {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 9
        }

        .conf span {
            position: absolute;
            top: -30px;
            font-size: 26px;
            animation: fall 2.4s linear forwards
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(540deg);
                opacity: .2
            }
        }

        @media (prefers-reduced-motion:reduce) {
            .conf span {
                animation: none;
                display: none
            }

            .bar i {
                transition: none
            }
        }

        button:focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 2px
        }

        body:before,
        body:after {
            content: "";
            position: fixed;
            width: 46vmax;
            height: 46vmax;
            border-radius: 50%;
            filter: blur(70px);
            opacity: .35;
            z-index: -1;
            animation: drift 18s ease-in-out infinite alternate;
            pointer-events: none
        }

        body:before {
            background: #7c5cff;
            top: -20vmax;
            left: -15vmax
        }

        body:after {
            background: #00c2ff;
            bottom: -22vmax;
            right: -15vmax;
            animation-delay: -9s
        }

        @keyframes drift {
            to {
                transform: translate(8vmax, 6vmax)
            }
        }

        .mas {
            font-size: 72px;
            animation: bob 2.4s ease-in-out infinite
        }

        @keyframes bob {
            50% {
                transform: translateY(-10px) rotate(-5deg)
            }
        }

        .node.cur {
            animation: pulse 1.6s infinite
        }

        @keyframes pulse {
            50% {
                box-shadow: 0 5px 0 var(--c), 0 0 0 9px color-mix(in srgb, var(--c) 28%, transparent)
            }
        }

        .dots {
            display: flex;
            gap: 6px;
            margin: 8px 0 14px
        }

        .dots i {
            flex: 1;
            height: 8px;
            border-radius: 9px;
            background: var(--line)
        }

        .dots i.on {
            background: var(--p)
        }

        .slide {
            background: var(--card);
            border: 3px solid var(--c);
            border-radius: 26px;
            padding: 22px;
            box-shadow: 0 7px 0 var(--c);
            min-height: 190px;
            animation: pop .35s
        }

        @keyframes pop {
            from {
                transform: scale(.96);
                opacity: 0
            }
        }

        .slide.an {
            background: linear-gradient(135deg, color-mix(in srgb, var(--c) 24%, var(--card)), var(--card))
        }

        .slide.mem {
            background: linear-gradient(135deg, color-mix(in srgb, var(--gold) 32%, var(--card)), var(--card))
        }

        .sic {
            font-size: 48px;
            line-height: 1.1
        }

        .sb {
            font-size: 17px;
            line-height: 1.7
        }

        .slide h3 {
            font-size: 22px;
            margin: 4px 0 6px
        }

        .nav {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 16px
        }

        .lt {
            font-size: 26px
        }

        .btn:disabled {
            opacity: .35;
            cursor: not-allowed
        }

        input[type=range] {
            width: 100%;
            accent-color: var(--p)
        }

        .in {
            width: 100%;
            padding: 8px 10px;
            border-radius: 12px;
            border: 2px solid var(--line);
            background: var(--card);
            color: var(--ink);
            font: 700 16px Nunito;
            margin: 4px 0 10px
        }

        @media (prefers-reduced-motion:reduce) {

            *,
            :before,
            :after {
                animation: none !important
            }
        }

        .wrap {
            max-width: 960px
        }

        .hero {
            display: flex;
            gap: 22px;
            align-items: center;
            text-align: left;
            padding: 8px 4px 18px
        }

        .hero .mas {
            font-size: 88px
        }

        .hero p {
            margin: 6px 0 4px;
            max-width: 520px
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 22px
        }

        .stats div {
            background: var(--card);
            border: 2px solid var(--line);
            border-radius: 18px;
            padding: 12px;
            text-align: center;
            box-shadow: 0 4px 0 var(--line)
        }

        .stats b {
            display: block;
            font: 800 24px 'Baloo 2'
        }

        .stats small,
        .mut {
            color: var(--mut)
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 16px
        }

        .grid .node {
            width: 100%;
            align-self: stretch;
            min-height: 118px
        }

        .grid .node.boss {
            grid-column: 1/-1
        }

        .nt {
            display: flex;
            flex-direction: column;
            gap: 2px
        }

        .lay {
            display: block
        }

        .side {
            display: none
        }

        @media(min-width:800px) {
            .lay {
                display: grid;
                grid-template-columns: 230px 1fr;
                gap: 22px;
                align-items: start
            }

            .side {
                display: flex;
                flex-direction: column;
                gap: 8px;
                position: sticky;
                top: 90px
            }

            .dots {
                display: none
            }
        }

        .st {
            display: flex;
            gap: 10px;
            align-items: center;
            text-align: left;
            padding: 10px 12px;
            border-radius: 14px;
            border: 2px solid var(--line);
            background: var(--card);
            color: var(--ink);
            font: 700 14px Nunito;
            cursor: pointer
        }

        .st span {
            width: 28px;
            text-align: center;
            flex: none
        }

        .st.cur {
            border-color: var(--c);
            background: color-mix(in srgb, var(--c) 18%, var(--card))
        }

        .st.dn {
            opacity: .7
        }

        .qw {
            max-width: 720px;
            margin: 0 auto
        }

        .qbar {
            height: 10px;
            background: var(--code);
            border-radius: 9px;
            overflow: hidden;
            margin: 6px 0 12px
        }

        .qbar i {
            display: block;
            height: 100%;
            background: var(--ok);
            transition: width .4s
        }

        .chip {
            background: var(--card);
            border: 2px solid var(--line);
            border-radius: 99px;
            padding: 2px 12px
        }

        .lt2 {
            display: inline-grid;
            place-items: center;
            width: 28px;
            height: 28px;
            border-radius: 9px;
            background: var(--code);
            margin-right: 10px;
            font-weight: 800
        }

        @media(max-width:560px) {
            .hero {
                flex-direction: column;
                text-align: center
            }

            .stats b {
                font-size: 19px
            }
        }

        * {
            -webkit-tap-highlight-color: transparent
        }

        button {
            touch-action: manipulation
        }

        .btn,
        .opt,
        .st,
        .back {
            min-height: 44px
        }

        .back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 0 0 12px;
            padding: 8px 18px 8px 12px;
            border-radius: 99px;
            border: 1.5px solid var(--line);
            background: color-mix(in srgb, var(--card) 72%, transparent);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            color: var(--ink);
            font: 700 14px Nunito;
            letter-spacing: .2px;
            box-shadow: 0 2px 12px rgba(80, 60, 160, .14);
            transition: border-color .2s, color .2s, transform .2s
        }

        .back .ar {
            display: grid;
            place-items: center;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--p);
            color: #fff;
            font-size: 17px;
            line-height: 1;
            padding-bottom: 2px
        }

        .back:hover {
            border-color: var(--p);
            color: var(--p);
            transform: translateX(-2px)
        }

        .back:active {
            transform: scale(.96)
        }

        .hud .back {
            margin: 0
        }

        .node:active:not(:disabled),
        .opt:active:not(:disabled),
        .st:active {
            transform: scale(.98)
        }

        @media(hover:none) {
            .node:hover {
                transform: none
            }
        }

        @media(max-width:640px) {
            .wrap {
                padding: 6px 12px calc(104px + env(safe-area-inset-bottom, 0px))
            }

            .top {
                border-radius: 16px;
                padding: 8px 12px;
                gap: 8px;
                margin: 4px 0 14px
            }

            .rank {
                font-size: 15px
            }

            .xp {
                font-size: 12px
            }

            .hero {
                padding: 0 0 14px;
                gap: 6px
            }

            .hero .mas {
                font-size: 64px
            }

            .hero h1 {
                font-size: 32px
            }

            .hero p {
                font-size: 15px
            }

            .stats {
                gap: 8px;
                margin-bottom: 16px
            }

            .stats div {
                padding: 10px 4px;
                border-radius: 16px
            }

            .stats b {
                font-size: 18px
            }

            .stats small {
                font-size: 11px
            }

            .grid {
                grid-template-columns: 1fr;
                gap: 12px
            }

            .grid .node {
                min-height: 96px
            }

            .lt {
                font-size: 22px;
                margin-bottom: 6px
            }

            .slide {
                padding: 18px;
                border-radius: 22px;
                min-height: 0
            }

            .sb {
                font-size: 16px
            }

            .sic {
                font-size: 40px
            }

            .nav {
                position: fixed;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 6;
                margin: 0;
                gap: 10px;
                padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
                background: color-mix(in srgb, var(--card) 88%, transparent);
                -webkit-backdrop-filter: blur(14px);
                backdrop-filter: blur(14px);
                border-top: 2px solid var(--line)
            }

            .nav .btn {
                flex: 1;
                margin: 0;
                padding: 12px 8px;
                font-size: 16px
            }

            .opt {
                padding: 14px;
                border-radius: 18px
            }

            #fb .btn,
            .card>.btn {
                width: 100%
            }

            .card {
                padding: 16px;
                border-radius: 20px
            }

            .hud {
                gap: 8px
            }
        }

        .vis {
            background: color-mix(in srgb, var(--code) 70%, var(--card));
            border: 2px dashed var(--line);
            border-radius: 18px;
            padding: 8px;
            margin: 8px 0 14px
        }

        .sv {
            width: 100%;
            height: auto;
            display: block
        }

        .sv text {
            fill: var(--ink);
            font-family: Nunito, sans-serif;
            font-weight: 700
        }
    </style>
</head>

<body>
    <div class="wrap" id="app"></div>
    <script>
        const L = [
            {

                pts: [],
                q: [['Acuan √2 = 1,41421356, hampiran 1,41. Galat absolutnya?', '0,00421356', '1,41421356', '0,01', '0,0421356', '|1,41421356 − 1,41| = 0,00421356.'], ['Kapan galat relatif tidak bisa dihitung?', 'Saat nilai acuan = 0', 'Saat hampiran = 0', 'Saat galat absolut = 0', 'Saat toleransi = 0', 'Rumusnya dibagi |acuan|, jadi acuan 0 = bagi nol.'], ['6,4876 ke 2 angka di belakang koma: dibulatkan vs dipotong?', '6,49 dan 6,48', '6,48 dan 6,49', '6,49 dan 6,49', '6,48 dan 6,48', 'Digit berikutnya 7 (≥5) → naik saat dibulatkan; dipotong langsung dibuang.']]
            },
            {
                id: 3, e: '✂️', t: 'Metode Bisection', d: 'Belah interval berulang', c: '#12b886', bis: 1,
                pts: [],
                q: [['Syarat awal Bisection pada [a, b]?', 'f(a)·f(b) < 0', 'f(a)·f(b) > 0', 'f(a) = f(b)', 'f(a) + f(b) = 0', 'Beda tanda + kontinu → kurva pasti memotong sumbu-x.'], ['f(x)=x³−x−2 pada [1,2], titik tengah c iterasi 1?', '1,5', '1', '2', '1,75', 'c = (1+2)/2 = 1,5.'], ['Apa arti U = (b − a)/2?', 'Batas maksimum tebakan meleset dari akar', 'Nilai f(c)', 'Akar sebenarnya', 'Jumlah iterasi', 'U berasal dari lebar interval, bukan dari nilai fungsi.']]
            },
            {
                id: 4, e: '🚀', t: 'Metode Newton', d: 'Garis singgung menuju akar', c: '#ff8a00',

        const X = {
            1: { an: 'Bayangin kamu naik motor. Kecepatan rata-rata satu perjalanan itu beda dengan angka di speedometer <b>saat ini juga</b>. Nah, turunan itu speedometer-nya: kecuramannya di satu titik, bukan rata-rata.', mem: 'Akar = f(x) nol · Gradien = naik ÷ maju · Turunan = gradien tepat di satu titik · pangkat turun jadi pengali.' },
            2: { an: 'Kamu bilang tinggimu 170 cm, padahal aslinya 170,4. Meleset 0,4 itu namanya <b>galat</b>. Buat tinggi badan sih kecil, tapi kalau itu ukuran kuku, parah banget. Makanya kita juga ngitung galat <b>relatif</b>.', mem: 'Galat absolut = selisih · relatif = selisih ÷ nilai asli · persen = relatif × 100 · acuan 0 = nggak bisa dihitung.' },
            3: { an: 'Pernah main tebak angka? Tebak 50, dibilang "kurang tinggi", jadi separuh bawah dicoret. Bisection begitu juga, cuma yang dicoret itu <b>daerah yang pasti nggak ada akarnya</b>.', mem: 'Ujung kiri dan kanan beda tanda · titik tengah c · U = (b − a) ÷ 2 · kalau U sudah kecil, selesai.' },
            4: { an: 'Bayangin kamu turun bukit gelap. Kamu raba kemiringan tanah di kakimu, terus melangkah ke arah yang datar. Newton begitu: <b>raba kemiringan (turunan), lalu meluncur ke sumbu-x</b>. Ulangi sampai pas.', mem: 'Tebakan baru = lama − f ÷ f′ · berhenti kalau δ dan R sama-sama kecil · awas turunan 0.' },
            5: { an: 'Kayak teka-teki detektif: beberapa petunjuk harus benar sekaligus. Eliminasi Gauss <b>menyingkirkan variabel satu per satu</b> sampai tinggal satu yang gampang dihitung, lalu kamu naik lagi ke atas.', mem: 'Tulis matriks · nolin angka di bawah diagonal · baca dari bawah ke atas · cek lagi di soal.' },
            6: { an: 'Gauss itu nyusun tangga sampai atap, terus turun pelan-pelan. Gauss–Jordan <b>sekalian beres-beres</b> sampai tiap baris cuma berisi satu variabel. Jawabannya tinggal dibaca.', mem: 'Pivot jadi 1 · nolin angka di atas dan bawah pivot · hasilnya identitas · jawaban langsung kebaca.' }
        };
        const P = {
            1: [['🎯', 'Akar itu maksudnya apa?', 'Bayangin sebuah rumus yang kalau kamu isi angka, dia ngasih angka lain. Misalnya f(x) = x² − 4. Kalau x diisi 3, hasilnya 9 − 4 = 5. Kalau x diisi 2, hasilnya 4 − 4 = 0.<br><br>Nah, x yang bikin hasilnya <b>nol</b> itu namanya akar. Jadi 2 adalah akar. −2 juga akar, karena (−2)² − 4 = 0. Di grafik, akar itu titik tempat kurva menyentuh garis datar (sumbu-x). Singkatnya: akar = jawaban dari pertanyaan "x berapa supaya hasilnya nol?"'],
            ['📐', 'Gradien: seberapa miring garisnya', 'Bayangin tangga. Ada yang landai, ada yang curam. Kecuramannya bisa diukur: berapa tinggi kamu naik, dibagi berapa jauh kamu melangkah ke depan.<br><br>Contoh garis y = 2x + 1. Dari titik (0, 1) ke titik (2, 5): naik 4, maju 2. Jadi 4 ÷ 2 = 2. Itu gradiennya. Artinya, tiap maju 1 langkah kamu naik 2.'],
            ['✂️', 'Garis sekan: miringnya di antara dua titik', 'Di kurva, kemiringannya berubah-ubah, jadi kita nggak bisa bilang "kurva ini miringnya sekian". Yang bisa kita lakukan: pilih dua titik, tarik garis lurus lewat keduanya, lalu hitung miringnya seperti tadi.<br><br>Contoh f(x) = x² − 4. Titik A di x = 1 (tingginya −3), titik B di x = 3 (tingginya 5). Naiknya 5 − (−3) = 8, majunya 3 − 1 = 2. Jadi miringnya 4. Itu garis sekan, dan angka 4 cuma kemiringan <i>rata-rata</i> dari A ke B.'],
            ['⚡', 'Turunan, tinggal satu langkah lagi', 'Gimana kalau kita mau tahu miringnya <i>tepat di titik A saja</i>? Caranya: geser titik B pelan-pelan mendekat ke A. Makin dekat, kemiringan garisnya makin mendekati satu angka tertentu. Angka itu adalah turunan di A.<br><br>(B nggak boleh benar-benar sama dengan A, karena jaraknya jadi nol dan kita harus bagi dengan nol. Jadi dekat sekali, tapi jangan nempel.)<br><br>Kabar baiknya, ada jalan pintas: pangkatnya turun jadi pengali, lalu pangkatnya dikurangi 1. x² jadi 2x. Jadi di x = 1, turunannya 2 × 1 = 2. Di langkah berikutnya, coba geser slider dan lihat angkanya mendekati 2.']],
            2: [['🔍', 'Kenapa hasil hitungan bisa meleset?', 'Kalau kamu tekan √2 di kalkulator, keluar 1,41421356… dan angkanya nggak ada habisnya. Padahal kita nggak mungkin nulis angka tanpa ujung, jadi kita potong, misalnya jadi 1,41. Angka potongan itu disebut <b>hampiran</b>. Yang paling tepat disebut nilai eksak atau acuan.<br><br>Pasti ada selisihnya, kan? Selisih itulah yang disebut <b>galat</b>. Di metode numerik kita hampir selalu dapat hampiran, jadi kita harus bisa mengukur seberapa meleset, lalu menilai itu sudah cukup bagus atau belum.'],
            ['🧮', 'Cara ngitung galat, pakai contoh', 'Pakai contoh tadi: acuan 1,41421356, hampiran 1,41.<br><br>Galat absolut = selisihnya aja: 1,41421356 − 1,41 = 0,00421356.<br>Galat relatif = galat absolut dibagi acuan: 0,00421356 ÷ 1,41421356 ≈ 0,00298.<br>Galat persen = galat relatif × 100, jadi sekitar 0,298%.<br><br>Ketiganya menceritakan hal yang sama dengan cara berbeda. Yang absolut bilang "meleset berapa", yang persen bilang "meleset berapa persen dari ukuran aslinya".'],
            ['⚖️', 'Kenapa butuh galat relatif?', 'Bayangin dua kasus. Pertama: harusnya 2, kamu dapat 1. Kedua: harusnya 1.000.000, kamu dapat 999.999. Dua-duanya meleset 1. Tapi yang pertama parah banget (meleset setengahnya!), yang kedua hampir nggak terasa.<br><br>Galat absolut nggak bisa membedakan keduanya. Galat relatif bisa, karena meleset-nya dibandingin dengan besar nilai aslinya.<br><br>Tapi ada jebakan: kalau nilai aslinya 0, kamu harus bagi dengan 0. Itu nggak boleh, jadi galat relatif nggak bisa dipakai. Di spreadsheet keluarnya #DIV/0!.'],
            ['✅', 'Toleransi dan pembulatan', 'Toleransi itu batas meleset yang kamu setujui. Misalnya kamu bilang "meleset 0,01 masih oke". Galat 0,0042 lebih kecil dari 0,01, jadi hampirannya diterima. Tapi kalau toleransinya 0,001, belum cukup, harus diperbaiki.<br><br>Satu lagi, bedain pembulatan dan pemotongan. Angka 6,4876 mau dibuat 2 angka di belakang koma. Dibulatkan: lihat angka berikutnya (7). Karena 5 atau lebih, angka sebelumnya naik jadi 6,49. Dipotong: sisanya dibuang aja, jadi 6,48.']],
            3: [['🎲', 'Idenya mirip tebak angka', 'Kamu pasti pernah main tebak angka 1 sampai 100. Teman bilang "tebak!", kamu jawab 50. Dia bilang "kurang tinggi". Sekarang kamu tahu angkanya ada di 51 sampai 100, jadi 1 sampai 50 kamu buang. Tebak lagi 75, dan seterusnya. Tiap tebakan, daerah pencarianmu jadi setengahnya.<br><br>Bisection persis begitu, tapi yang dicari adalah akar dari sebuah persamaan (x yang bikin f(x) = 0).'],
            ['📋', 'Kapan boleh pakai Bisection?', 'Kamu perlu dua titik, sebut a (kiri) dan b (kanan), yang nilai fungsinya <b>beda tanda</b>: satu positif, satu negatif.<br><br>Kenapa? Bayangin kamu jalan di jalan yang nyambung. Di kiri kamu ada di atas permukaan laut, di kanan kamu di bawahnya. Pasti ada satu titik di antaranya yang tepat di permukaan laut (nol). Syaratnya, jalannya nggak boleh putus.<br><br>Contoh f(x) = x³ − x − 2. f(1) = −2 (negatif), f(2) = 4 (positif). Beda tanda, jadi aman: akarnya ada di antara 1 dan 2.'],
            ['🔁', 'Langkah tiap putaran', 'Lanjut contoh tadi, daerahnya [1, 2].<br><br>1) Ambil titik tengah: c = (1 + 2) ÷ 2 = 1,5.<br>2) Hitung f(1,5) = 3,375 − 1,5 − 2 = −0,125 (negatif).<br>3) f(1) juga negatif, jadi 1 dan 1,5 sama-sama negatif. Akarnya pasti bukan di situ. Akarnya ada di antara 1,5 dan 2 (beda tanda).<br>4) Daerah barunya jadi [1,5; 2]. Ulangi.<br><br>Aturan singkatnya: buang separuh yang kedua ujungnya sama tanda.'],
            ['🛑', 'Kapan berhenti?', 'Kita nggak bakal pas di akarnya, jadi kita perlu tahu "udah cukup dekat belum". Caranya pakai U, yaitu setengah dari lebar daerah: U = (b − a) ÷ 2. Artinya, tebakanmu paling banter meleset sejauh U dari akar yang sebenarnya.<br><br>Tiap putaran lebar daerahnya jadi setengah, jadi U juga: 0,5 → 0,25 → 0,125 → dan seterusnya. Kalau U sudah ≤ toleransi (misalnya 0,01), berhenti. Di contoh ini terjadi di putaran ke-7, dengan akar sekitar 1,523.<br><br>Awas ketuker: U itu jarak ke akar. Nilai f(c) bukan jarak, itu cuma tinggi kurva di titik c.']],
            4: [['🏹', 'Idenya: pakai garis singgung', 'Misalnya kamu mau cari akar, dan kamu punya tebakan awal. Tebakan itu hampir pasti meleset. Tapi kamu bisa lihat kurvanya di titik itu: miring ke arah mana?<br><br>Tarik garis lurus yang menempel di kurva tepat di titik tebakanmu (garis singgung). Garis itu menyentuh sumbu-x di suatu tempat. Pindah ke sana dan jadikan itu tebakan baru. Biasanya titik itu jauh lebih dekat ke akar. Ulangi terus.<br><br>Beda sama Bisection yang membelah daerah, Newton "meluncur" mengikuti kemiringan. Makanya dia butuh turunan (ingat, turunan = kemiringan).'],
            ['🧮', 'Rumusnya dari mana sih?', 'Rumusnya kelihatan menakutkan, tapi isinya sederhana:<br><code>x baru = x lama − f(x lama) ÷ f′(x lama)</code><br><br>Bacanya begini: f(x lama) itu tinggi kurva di tebakanmu, dan f′ itu kemiringannya. Tinggi dibagi kemiringan = jarak mendatar yang harus kamu geser supaya sampai di sumbu-x. Makanya itu dikurangkan dari tebakan lama.'],
            ['🔢', 'Contoh hitungan: cari √2', 'Kita cari akar dari f(x) = x² − 2 (itu √2). Turunannya 2x. Mulai dari tebakan 1,5.<br><br>f(1,5) = 2,25 − 2 = 0,25. f′(1,5) = 3. Tebakan baru = 1,5 − 0,25 ÷ 3 = 1,4167.<br>Ulangi dengan 1,4167: f = 0,0069 dan f′ = 2,8333. Tebakan baru = 1,4167 − 0,0069 ÷ 2,8333 = 1,4142.<br><br>1,4142 itu sudah √2. Cuma 3 putaran! Itu kenapa Newton terkenal cepat.'],
            ['🛑', 'Kapan berhenti, dan apa yang bisa salah?', 'Kita periksa dua hal. δ = seberapa jauh tebakan bergeser dibanding sebelumnya. R = nilai mutlak f di tebakan baru (seberapa dekat ke nol). Berhenti kalau keduanya ≤ ε. Di tugas, ε = 0,0001. Dua-duanya perlu karena satu aja bisa menipu.<br><br>Yang bisa bikin gagal: kalau kemiringan f′ = 0, kamu harus bagi nol, jadi stop dan ganti tebakan awal. Tebakan awal yang jelek juga bisa bikin tebakan baru loncat jauh. Batasi maksimal 20 putaran; kalau belum memenuhi, tulis "belum memenuhi kriteria", jangan bilang berhasil.']],
            5: [['🧱', 'SPL itu apa?', 'SPL = sistem persamaan linear. Gampangnya: beberapa teka-teki angka yang harus terpenuhi bersamaan.<br><br>Contoh kecil: x + y = 5 dan 2x + y = 7. Kurangkan persamaan pertama dari yang kedua, ketemu x = 2. Lalu 2 + y = 5, jadi y = 3.<br><br>Dengan 2 persamaan masih gampang. Dengan 3 atau lebih, kita butuh cara yang rapi. Itulah eliminasi Gauss.'],
            ['📝', 'Menulisnya sebagai matriks', 'Biar rapi, kita buang huruf x, y, z dan cuma tulis angkanya, satu persamaan per baris:<br><code>x + y + z = 6 → [1 1 1 | 6]</code><br><code>2x − y + z = 3 → [2 −1 1 | 3]</code><br><code>x + 2y + 3z = 14 → [1 2 3 | 14]</code><br><br>Urutan kolomnya: x, y, z, lalu ruas kanan. Kalau ada variabel yang nggak muncul, tulis 0. Ini disebut matriks augmented.'],
            ['🔧', 'Boleh ngapain di baris?', 'Ada tiga hal yang aman dilakukan karena nggak mengubah jawaban: tukar dua baris, kalikan satu baris dengan angka (bukan nol), atau tambahkan kelipatan satu baris ke baris lain. Semuanya dilakukan ke seluruh baris, termasuk angka di ruas kanan.<br><br>Tujuannya: bikin angka di bawah diagonal jadi 0. Contoh: baris 2 itu [2 −1 1 | 3], dan kita mau angka 2-nya jadi 0. Kurangkan 2 kali baris 1 ([1 1 1 | 6]), hasilnya [0 −3 −1 | −9]. Angka 2 yang dikali itu disebut pengali (angka yang mau dihilangkan ÷ pivot di baris atas).'],
            ['🔺', 'Terus jawabannya dari mana?', 'Setelah semua angka di bawah diagonal jadi 0, bentuknya seperti segitiga. Misalnya baris paling bawah jadi [0 0 5 | 15]. Artinya 5z = 15, jadi z = 3.<br><br>Naik ke baris atasnya: y + 2z = 8. Karena z = 3, y = 8 − 6 = 2. Naik lagi: x + y + z = 6, jadi x = 6 − 2 − 3 = 1.<br><br>Ini namanya substitusi mundur. Terakhir, masukkan x = 1, y = 2, z = 3 ke soal awal untuk memastikan. Kalau pivotnya ketemu 0, tukar baris dengan baris di bawahnya. Jangan pernah bagi dengan nol.']],
            6: [['🏁', 'Bedanya sama Gauss', 'Di Gauss, kamu berhenti di bentuk segitiga, lalu masih harus ngitung dari bawah ke atas. Gauss–Jordan lebih rajin: lanjut membersihkan matriks sampai sisi kirinya cuma berisi angka 1 di diagonal dan 0 di tempat lain (disebut matriks identitas).<br><br>Hasilnya, tiap baris isinya satu variabel saja, dan jawabannya langsung kelihatan di kolom paling kanan, tanpa substitusi mundur.'],
            ['🪜', 'Caranya, lanjut dari segitiga tadi', 'Kita lanjut dari hasil Gauss tadi:<br><code>[1 1 1 | 6]</code><br><code>[0 1 2 | 8]</code><br><code>[0 0 5 | 15]</code><br><br>Langkah 1: bikin angka 5 jadi 1 dengan membagi seluruh baris 3 dengan 5 (angka 15 di kanan ikut dibagi), jadi [0 0 1 | 3]. Sudah kelihatan z = 3.<br><br>Langkah 2: pakai baris 3 ini untuk membersihkan angka z di atasnya. Baris 2 dikurangi 2 kali baris 3, jadi [0 1 0 | 2], dan y = 2.<br><br>Langkah 3: baris 1 dikurangi baris 3, lalu dikurangi baris 2, jadi [1 0 0 | 1], dan x = 1.'],
            ['📌', 'Pola yang gampang diingat', 'Semua langkahnya punya pola yang sama: baris baru = baris lama − (angka yang mau dinolkan) × baris pivot. Bagi baris pivot dulu sampai pivotnya 1, supaya "angka yang mau dinolkan" langsung jadi pengali.<br><br>Terakhir, selalu cek balik jawabanmu ke persamaan awal. Di tugas spreadsheet, pastikan kamu menyimpan <b>rumusnya</b>, bukan cuma hasil akhir, kalau nggak tugasnya nggak dinilai. Tanda $ dipakai untuk mengunci sel pengali supaya nggak bergeser saat disalin.']]
        };
        const W = {
            1: ['Akar itu x yang bikin f(x) = 0. Faktorkan: (x − 2)(x + 2) = 0, jadi x = 2 atau x = −2.', 'Naiknya (5 − (−3)) = 8, majunya (3 − 1) = 2. Jadi 8 ÷ 2 = 4.', 'Pangkat turun jadi pengali: 3x² jadi 6x, 2x jadi 2, dan angka −5 hilang. Hasilnya 6x + 2.'],
            2: ['Tinggal dikurangi: 1,41421356 − 1,41 = 0,00421356. Selisih mentah aja.', 'Galat relatif dibagi nilai acuan. Kalau acuannya 0, jadi bagi nol, dan itu nggak boleh.', 'Dibulatkan: lihat digit berikutnya (7, jadi naik) → 6,49. Dipotong: langsung dibuang → 6,48.'],
            3: ['Kalau tanda di ujung kiri dan kanan beda, kurva pasti nyebrang sumbu-x di antaranya.', 'Titik tengahnya tinggal (1 + 2) ÷ 2 = 1,5.', 'U itu jarak paling jauh tebakanmu dari akar, dihitung dari lebar interval. Bukan nilai fungsinya.'],
            4: ['Rumus ini datang dari garis singgung: tebakan baru = tebakan lama dikurangi nilai fungsi dibagi kemiringan.', 'Kemiringannya nol, jadi kamu harus bagi dengan nol, dan itu nggak bisa. Ganti tebakan awalnya.', 'Perubahan kecil aja belum menjamin akurat, jadi cek dua-duanya: δ dan R harus sama-sama ≤ ε.'],
            5: ['Pengali = angka yang mau dinolkan dibagi pivot. Contoh: 2 ÷ 1 = 2, jadi R₂ − 2R₁.', 'Gauss berhenti di segitiga atas, lalu kamu hitung dari bawah ke atas (substitusi mundur).', 'Dari z = 3: y + 2(3) = 8, jadi y = 8 − 6 = 2.'],
            6: ['Gauss–Jordan lanjut sampai sisi kiri jadi matriks identitas (RREF).', 'Bagi seluruh baris dengan 5, ruas kanan ikut: 15 ÷ 5 = 3. Jadi [0 0 1 | 3].', 'Jawabannya langsung kebaca dari matriks identitas, nggak perlu hitung mundur. Tapi tetap cek balik ya.']
        };
        L.forEach(l => { l.pts = P[l.id]; l.q.forEach((q, i) => { q[5] = W[l.id][i] }) });
        const RANKS = ['Pemula Hitung 🐣', 'Pemburu Akar 🏹', 'Penakluk Galat 🛡️', 'Master Matriks 🧙', 'Legenda Numerik 👑'];
        let S = { xp: 0, st: {} }, V = { v: 'map' };
        try { const s = localStorage.getItem('nq'); if (s) S = JSON.parse(s) } catch (e) { }
        const save = () => { try { localStorage.setItem('nq', JSON.stringify(S)) } catch (e) { } };
        const $ = document.getElementById('app');
        const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const sh = a => a.map(x => [Math.random(), x]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
        const done = () => L.filter(l => S.st[l.id] > 0).length;
        const rk = () => Math.min(RANKS.length - 1, Math.floor(S.xp / 100));
        function hdr() { const r = rk(), n = (S.xp % 100); return `<div class="top"><span class="rank">${RANKS[r]}</span><div class="bar"><i style="width:${r == 4 ? 100 : n}%"></i></div><span class="xp">⭐ ${S.xp} XP</span></div>` }
        function stars(n) { return n ? '★'.repeat(n) + '☆'.repeat(3 - n) : '☆☆☆' }
        function map() {

            $.innerHTML = hdr() + `<button class="back" onclick="map()"><span class="ar">‹</span> Peta</button><h2 class="lt">${l.e} P${l.id} · ${l.t}</h2><div class="dots">${s.map((_, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join('')}</div><div class="lay"><div class="side">${s.map((q, k) => `<button class="st${k == i ? ' cur' : ''}${k < i ? ' dn' : ''}" style="--c:${l.c}" onclick="LS.i=${k};slide()"><span>${k < i ? '✓' : q[0]}</span>${lab(q, k)}</button>`).join('')}</div><div><div class="slide ${i == 0 ? 'an' : last ? 'mem' : ''}" style="--c:${l.c}"><div class="sic">${p[0]}</div>${p[1] ? `<h3>${p[1]}</h3>` : ''}${p[4] ? `<div class="vis">${p[4]}</div>` : ''}<div class="sb">${p[2]}</div></div><div class="nav"><button class="btn alt" ${i ? '' : 'disabled'} onclick="LS.i--;slide()">← Balik</button>${last ? `<button class="btn" onclick="quiz(${l.id})">Mulai Quiz ⚔️</button>` : `<button class="btn" onclick="LS.i++;slide()">Lanjut →</button>`}</div></div></div>`;
            if (p[3]) p[3](); window.scrollTo(0, 0)
        }
        const f = x => x * x * x - x - 2;
        function bshow(msg) { const { a, b } = bi, c = (a + b) / 2, u = (b - a) / 2; $i('bt').innerHTML = (bi.rows.length ? tbl(['iter', 'a', 'b', 'c', 'f(c)', 'U'], bi.rows.map(x => [x[0], ...x.slice(1).map(n4)])) : '') + (u <= 0.01 ? `<div class="fb good">U ≤ 0,01 → berhenti 🎉 akar ≈ ${n4(c)}</div>` : `<div class="fb">Iterasi ${bi.rows.length + 1}: interval [${n4(a)}; ${n4(b)}], c = ${n4(c)}, f(c) = ${n4(f(c))}. Di mana akarnya?</div><button class="btn alt" onclick="bpick(0)">Di kiri [a, c]</button> <button class="btn alt" onclick="bpick(1)">Di kanan [c, b]</button>`) + (msg || '') + '<br><button class="btn alt" onclick="breset()">Ulang</button>' }
        function bpick(r) { const { a, b } = bi, c = (a + b) / 2, right = f(a) * f(c) > 0 ? 1 : 0; if (r != right) { bshow('<div class="fb bad">Hmm, belum pas. Coba cek tandanya lagi: kalau f(a)·f(c) &lt; 0 akarnya di kiri, kalau &gt; 0 di kanan.</div>'); return } bi.rows.push([bi.rows.length + 1, a, b, c, f(c), (b - a) / 2]); if (right) bi.a = c; else bi.b = c; bshow() }
        function breset() { bi = { a: 1, b: 2, rows: [] }; bshow() }
        let Q;
        function quiz(id) { const l = L.find(x => x.id == id); Q = { id, qs: sh(l.q), i: 0, h: 3, ok: 0, c: l.c }; ask() }
        function boss() { const all = L.flatMap(l => l.q); Q = { id: 7, qs: sh(all).slice(0, 8), i: 0, h: 4, ok: 0, c: '#ff5470' }; ask() }
        function ask() {
            V.v = 'quiz'; const q = Q.qs[Q.i], o = sh(q.slice(1, 5).map((t, k) => [t, k == 0])); Q.cur = { o, q };
            $.innerHTML = hdr() + `<div class="qw"><div class="hud"><button class="back" onclick="map()"><span class="ar">✕</span> Keluar</button><span>${'❤️'.repeat(Math.max(0, Q.h)) || '💔'}</span><span class="chip">🔥 Combo ${Q.cb || 0}</span></div><div class="qbar"><i style="width:${Q.i / Q.qs.length * 100}%"></i></div><div class="card" style="border-color:${Q.c}"><small class="mut">Soal ${Q.i + 1} dari ${Q.qs.length} · tekan 1–4 untuk menjawab</small><h3>${esc(q[0])}</h3><div id="os">${o.map((x, k) => `<button class="opt" onclick="pick(${k})"><span class="lt2">${'ABCD'[k]}</span>${esc(x[0])}</button>`).join('')}</div><div id="fb"></div></div></div>`; window.scrollTo(0, 0)
        }
        function pick(k) {
            const { o, q } = Q.cur, right = o[k][1], first = !S.st[Q.id]; let bn = 0;
            document.querySelectorAll('.opt').forEach((b, j) => { b.disabled = true; if (o[j][1]) b.classList.add('good'); else if (j == k) b.classList.add('bad') });
            if (right) { Q.ok++; Q.cb = (Q.cb || 0) + 1; if (first) { S.xp += 10; if (Q.cb >= 3) { S.xp += 5; bn = 1 } } } else { Q.h--; Q.cb = 0 }
            S.n = (S.n || 0) + 1; S.c = (S.c || 0) + (right ? 1 : 0); save();
            const last = Q.i == Q.qs.length - 1 || Q.h <= 0;
            $i('fb').innerHTML = `<div class="fb ${right ? 'good' : 'bad'}">${right ? '🎉 Benar!' + (first ? ' +10 XP' : '') + (bn ? ' · combo +5 🔥' : '') : '😅 Yah, belum pas. Tenang, ini penjelasannya:'}<br><span style="font-weight:500">${q[5]}</span></div><button class="btn" onclick="${last ? 'fin()' : 'Q.i++;ask()'}">${last ? 'Lihat hasil' : 'Lanjut'} (Enter)</button>`
        }
        function fin() {
            const win = Q.h > 0, n = win ? Math.max(1, Math.min(3, Q.h - (Q.id == 7 ? 1 : 0))) : 0;
            let bonus = 0; if (win) { if (!S.st[Q.id]) bonus = Q.id == 7 ? 50 : 20; S.xp += bonus; S.st[Q.id] = Math.max(S.st[Q.id] || 0, n) } save();
            $.innerHTML = hdr() + `<div class="card" style="text-align:center;max-width:560px;margin:14px auto"><div class="big">${win ? (Q.id == 7 ? '👑' : '🏆') : '😵'}</div><h2>${win ? (Q.id == 7 ? 'Naga Galat dikalahkan!' : 'Level selesai!') : 'Hati habis!'}</h2><p class="stars" style="font-size:34px;margin:6px 0">${stars(n)}</p><p>${Q.ok}/${Q.qs.length} benar${bonus ? ` · bonus +${bonus} XP` : ''}</p>${win ? '' : '<p style="color:var(--mut)">Baca ulang materinya, lalu coba lagi.</p>'}<button class="btn" onclick="${Q.id == 7 ? 'boss()' : 'quiz(' + Q.id + ')'}">Main lagi</button> <button class="btn alt" onclick="${win || Q.id == 7 ? 'map()' : 'lesson(' + Q.id + ')'}">${win || Q.id == 7 ? 'Ke peta' : 'Baca materi'}</button></div>`; if (win) conf()
        }
        function conf() { const d = document.createElement('div'); d.className = 'conf'; d.innerHTML = Array.from({ length: 30 }, () => `<span style="left:${Math.random() * 100}%;animation-delay:${Math.random() * .8}s">${['🎉', '⭐', '✨', '💎', '🔥'][Math.random() * 5 | 0]}</span>`).join(''); document.body.appendChild(d); setTimeout(() => d.remove(), 3500) }
        document.addEventListener('keydown', e => {
            if (/INPUT|TEXTAREA/.test(e.target.tagName)) return;
            if (V.v == 'lesson') { if (e.key == 'ArrowRight' && LS.i < LS.s.length - 1) { LS.i++; slide() } if (e.key == 'ArrowLeft' && LS.i > 0) { LS.i--; slide() } }
            else if (V.v == 'quiz') {
                const k = '1234abcd'.indexOf(e.key.toLowerCase()); if (k >= 0) { const b = document.querySelectorAll('.opt')[k % 4]; if (b) b.click() }
                if (e.key == 'Enter' && e.target.tagName != 'BUTTON') { const n = document.querySelector('#fb .btn'); if (n) n.click() }
            }
        });
        map();
    </script>
</body>
